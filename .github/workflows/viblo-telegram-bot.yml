name: Viblo Telegram Bot

on:
  schedule:
    - cron: "0 * * * *"  # every hour at minute 0 (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: viblo-telegram-bot
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_POSTS: "5"
        run: python viblo-telegram-bot.py

      - name: Commit updated sent.json
        run: |
          if [[ -z "$(git status --porcelain sent.json)" ]]; then
            echo "No new posts sent — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sent.json
          git commit -m "chore: update sent posts history"
          git push
